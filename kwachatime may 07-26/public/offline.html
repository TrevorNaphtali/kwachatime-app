
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - KwachaTime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #064e3b; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>
  <div class="p-8 max-w-md">
    <div class="w-24 h-24 bg-white/10 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-2xl">
      <i class="fas fa-plane-slash text-4xl text-emerald-400"></i>
    </div>
    <h1 class="text-3xl font-black uppercase tracking-tighter mb-4">You're Offline</h1>
    <p class="text-emerald-100/70 text-sm font-medium mb-10 leading-relaxed">
      Capital never sleeps, but your connection did. Please check your data or Wi-Fi to access the KwachaTime Ledger.
    </p>
    <button onclick="window.location.reload()" class="w-full py-6 bg-white text-emerald-950 rounded-[2rem] font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">
      Retry Connection
    </button>
    <p class="mt-8 text-[9px] font-black uppercase text-emerald-500/50 tracking-[0.3em]">Lusaka HQ • Internal Systems</p>
  </div>
</body>
</html>
