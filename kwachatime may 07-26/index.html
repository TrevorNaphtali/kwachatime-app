    <meta charset="UTF-8" />

    <title>KwachaTime - Zambian Money Lending</title>
    <meta name="description" content="Premier Zambian micro-lending platform for secure, fast capital with physical office disbursement." />
    
    <!-- PWA & APK Optimization Tags -->
    <link rel="manifest" href="https://progressier.app/xVY2woQzZJ4egeaFUzhL/progressier.json"/>

    <meta name="theme-color" content="#30ae00" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KwachaTime" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icon.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
      body { 
        font-family: 'Inter', sans-serif; 
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        padding: var(--sat) var(--sar) var(--sab) var(--sal);
        background-color: #f9fafb;
        user-select: none; /* Prevents text selection for a native app feel */
        -webkit-user-select: none;
      }
      .dark body { background-color: #020617; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      
      /* Re-enable selection for inputs */
      input, select, textarea {
        user-select: text !important;
        -webkit-user-select: text !important;
        font-size: 16px !important; /* Prevents auto-zoom on mobile focus */
      }
    </style>
